<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#F5F7FA"/>
  
  <!-- Standard transport truck -->
  <g>
    <!-- Truck bed -->
    <rect x="30" y="140" width="170" height="65" rx="8" fill="url(#stdGrad)"/>
    
    <!-- Cabin -->
    <rect x="175" y="110" width="45" height="45" rx="5" fill="url(#stdGrad)"/>
    
    <!-- Cabin window -->
    <rect x="183" y="125" width="18" height="18" fill="#FFD700" opacity="0.8"/>
    
    <!-- Cargo boxes in truck bed -->
    <rect x="45" y="150" width="35" height="30" fill="#FFD700" opacity="0.3" stroke="#FFD700" stroke-width="2"/>
    <rect x="90" y="150" width="35" height="30" fill="#FFD700" opacity="0.3" stroke="#FFD700" stroke-width="2"/>
    <rect x="135" y="150" width="35" height="30" fill="#FFD700" opacity="0.3" stroke="#FFD700" stroke-width="2"/>
    
    <!-- Wheels -->
    <circle cx="75" cy="220" r="22" fill="#003D7A"/>
    <circle cx="170" cy="220" r="22" fill="#003D7A"/>
    <!-- Wheel detail -->
    <circle cx="75" cy="220" r="14" fill="none" stroke="#FFD700" stroke-width="3"/>
    <circle cx="170" cy="220" r="14" fill="none" stroke="#FFD700" stroke-width="3"/>
    
    <!-- Bumper -->
    <rect x="175" y="208" width="45" height="6" fill="#FFD700" opacity="0.6"/>
  </g>
</svg>
