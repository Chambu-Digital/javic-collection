<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#F5F7FA"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="jijiGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main container -->
  <rect width="512" height="512" rx="120" fill="url(#jijiGradient512)"/>
  
  <!-- Truck/Logistics icon with gold accents -->
  <g transform="translate(128, 140)">
    <!-- Truck body -->
    <rect x="0" y="64" width="192" height="106" rx="10" fill="#FFD700" opacity="0.9"/>
    
    <!-- Truck cabin -->
    <rect x="149" y="20" width="53" height="53" rx="8" fill="#FFD700"/>
    
    <!-- Windows -->
    <rect x="154" y="27" width="21" height="21" fill="#003D7A" opacity="0.6"/>
    <rect x="181" y="27" width="21" height="21" fill="#003D7A" opacity="0.6"/>
    
    <!-- Wheels -->
    <circle cx="48" cy="182" r="16" fill="#FFD700"/>
    <circle cx="165" cy="182" r="16" fill="#FFD700"/>
    
    <!-- Cargo indicator lines -->
    <line x1="21" y1="90" x2="128" y2="90" stroke="white" stroke-width="5" opacity="0.8"/>
    <line x1="21" y1="117" x2="128" y2="117" stroke="white" stroke-width="5" opacity="0.6"/>
    <line x1="21" y1="144" x2="128" y2="144" stroke="white" stroke-width="5" opacity="0.4"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
    JIJI
  </text>
  <text x="256" y="456" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#FFD700">
    FREIGHT
  </text>
</svg>
