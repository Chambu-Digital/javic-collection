<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" rx="45" fill="#F5F7FA"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="jijiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main container -->
  <rect width="192" height="192" rx="45" fill="url(#jijiGradient)"/>
  
  <!-- Truck/Logistics icon with gold accents -->
  <g transform="translate(48, 52)">
    <!-- Truck body -->
    <rect x="0" y="24" width="72" height="40" rx="4" fill="#FFD700" opacity="0.9"/>
    
    <!-- Truck cabin -->
    <rect x="56" y="8" width="20" height="20" rx="3" fill="#FFD700"/>
    
    <!-- Windows -->
    <rect x="58" y="10" width="8" height="8" fill="#003D7A" opacity="0.6"/>
    <rect x="68" y="10" width="8" height="8" fill="#003D7A" opacity="0.6"/>
    
    <!-- Wheels -->
    <circle cx="18" cy="68" r="6" fill="#FFD700"/>
    <circle cx="62" cy="68" r="6" fill="#FFD700"/>
    
    <!-- Cargo indicator lines -->
    <line x1="8" y1="34" x2="48" y2="34" stroke="white" stroke-width="2" opacity="0.8"/>
    <line x1="8" y1="44" x2="48" y2="44" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="8" y1="54" x2="48" y2="54" stroke="white" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Text below -->
  <text x="96" y="152" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    JIJI
  </text>
  <text x="96" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFD700">
    FREIGHT
  </text>
</svg>
