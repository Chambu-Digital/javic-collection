<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#F5F7FA"/>
  
  <!-- Special care vehicle -->
  <g>
    <!-- Vehicle body with protection bumpers -->
    <rect x="50" y="130" width="120" height="80" rx="8" fill="url(#fragGrad)"/>
    
    <!-- Protection bumpers (front and back) -->
    <rect x="35" y="145" width="15" height="50" fill="#FFD700" opacity="0.7" rx="3"/>
    <rect x="180" y="145" width="15" height="50" fill="#FFD700" opacity="0.7" rx="3"/>
    
    <!-- Side bumpers -->
    <rect x="50" y="115" width="120" height="8" fill="#FFD700" opacity="0.5" rx="2"/>
    <rect x="50" y="220" width="120" height="8" fill="#FFD700" opacity="0.5" rx="2"/>
    
    <!-- Cabin -->
    <rect x="165" y="110" width="40" height="40" rx="5" fill="url(#fragGrad)"/>
    
    <!-- Window -->
    <rect x="172" y="125" width="15" height="15" fill="#FFD700" opacity="0.8"/>
    
    <!-- Fragile package indicators (breakable mark) -->
    <g opacity="0.8">
      <rect x="65" y="155" width="25" height="25" fill="none" stroke="#FFD700" stroke-width="2"/>
      <text x="77" y="170" font-size="16" fill="#FFD700" text-anchor="middle" font-weight="bold">!</text>
    </g>
    
    <!-- Wheels -->
    <circle cx="80" cy="220" r="18" fill="#003D7A"/>
    <circle cx="150" cy="220" r="18" fill="#003D7A"/>
    <circle cx="80" cy="220" r="10" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle cx="150" cy="220" r="10" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>
</svg>
