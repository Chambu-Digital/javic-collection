<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse" opacity="0.1">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <!-- Decorative elements -->
  <!-- Truck on left side -->
  <g opacity="0.15">
    <!-- Truck body -->
    <rect x="50" y="250" width="300" height="150" rx="10" fill="white"/>
    <!-- Cabin -->
    <rect x="280" y="180" width="80" height="80" rx="5" fill="white"/>
    <!-- Windows -->
    <rect x="295" y="200" width="25" height="25" fill="#003D7A"/>
    <rect x="335" y="200" width="25" height="25" fill="#003D7A"/>
    <!-- Wheels -->
    <circle cx="120" cy="410" r="30" fill="white"/>
    <circle cx="280" cy="410" r="30" fill="white"/>
  </g>
  
  <!-- Package/cargo symbols on right -->
  <g opacity="0.12">
    <rect x="950" y="150" width="120" height="120" fill="white" rx="8"/>
    <line x1="960" y1="160" x2="1060" y2="160" stroke="#003D7A" stroke-width="4"/>
    <line x1="960" y1="185" x2="1060" y2="185" stroke="#003D7A" stroke-width="3"/>
    <line x1="960" y1="210" x2="1060" y2="210" stroke="#003D7A" stroke-width="2"/>
  </g>
  
  <!-- Shipping route lines -->
  <g opacity="0.08" stroke="white" stroke-width="2">
    <path d="M 200 500 Q 600 300 1000 450" fill="none" stroke-dasharray="10,5"/>
    <circle cx="200" cy="500" r="8" fill="white"/>
    <circle cx="1000" cy="450" r="8" fill="white"/>
  </g>
</svg>
