<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#F5F7FA"/>
  
  <!-- Express truck illustration -->
  <g>
    <!-- Truck body -->
    <rect x="40" y="140" width="140" height="70" rx="8" fill="url(#truckGrad)"/>
    
    <!-- Cabin -->
    <rect x="160" y="100" width="50" height="50" rx="6" fill="url(#truckGrad)"/>
    
    <!-- Windows -->
    <rect x="170" y="115" width="15" height="15" fill="#FFD700" opacity="0.8"/>
    <rect x="190" y="115" width="15" height="15" fill="#FFD700" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="80" cy="220" r="20" fill="#003D7A"/>
    <circle cx="160" cy="220" r="20" fill="#003D7A"/>
    <!-- Wheel detail -->
    <circle cx="80" cy="220" r="12" fill="none" stroke="#FFD700" stroke-width="3"/>
    <circle cx="160" cy="220" r="12" fill="none" stroke="#FFD700" stroke-width="3"/>
    
    <!-- Speed lines (showing express) -->
    <line x1="20" y1="155" x2="35" y2="155" stroke="#1E90FF" stroke-width="3"/>
    <line x1="20" y1="170" x2="30" y2="170" stroke="#1E90FF" stroke-width="2"/>
    <line x1="25" y1="185" x2="40" y2="185" stroke="#1E90FF" stroke-width="3"/>
  </g>
</svg>
