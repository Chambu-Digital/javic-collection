<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tempGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#F5F7FA"/>
  
  <!-- Refrigerated truck -->
  <g>
    <!-- Main body -->
    <rect x="45" y="135" width="135" height="75" rx="8" fill="url(#tempGrad)"/>
    
    <!-- Insulated cabin indicator (thicker walls) -->
    <rect x="50" y="140" width="125" height="65" rx="6" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.4"/>
    
    <!-- Cooling unit on top -->
    <rect x="95" y="120" width="60" height="20" fill="#FFD700" opacity="0.7" rx="3"/>
    <rect x="100" y="115" width="50" height="8" fill="#FFD700" opacity="0.9" rx="2"/>
    
    <!-- Temperature indicator -->
    <g opacity="0.9">
      <circle cx="75" cy="165" r="15" fill="#FFD700"/>
      <text x="75" y="172" font-size="12" fill="#003D7A" text-anchor="middle" font-weight="bold">°C</text>
    </g>
    
    <!-- Cabin -->
    <rect x="170" y="125" width="38" height="38" rx="5" fill="url(#tempGrad)"/>
    <rect x="177" y="140" width="12" height="12" fill="#FFD700" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="75" cy="220" r="20" fill="#003D7A"/>
    <circle cx="155" cy="220" r="20" fill="#003D7A"/>
    <circle cx="75" cy="220" r="12" fill="none" stroke="#FFD700" stroke-width="2"/>
    <circle cx="155" cy="220" r="12" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>
</svg>
